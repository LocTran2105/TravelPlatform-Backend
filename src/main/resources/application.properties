spring.config.import=optional:file:.env[.properties]
spring.application.name=Backend

#Config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

#GOOGLE
google.client.id=${GOOGLE_CLIENT_ID}

# ===============================
# Gmail SMTP
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

#Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

#Size of file upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==============================================================
# 10. API GEMINI
# ==============================================================
gemini.api.key.primary=${GEMINI_API_KEY_PRIMARY:}
gemini.api.key.fallback_1=${GEMINI_API_KEY_FALLBACK_1:}
gemini.api.key.fallback_2=${GEMINI_API_KEY_FALLBACK_2:}
gemini.api.key.fallback_3=${GEMINI_API_KEY_FALLBACK_3:}

gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent
# 0 = tat "thinking" cua Gemini 2.5 de tiet kiem token tren goi mien phi (-1 = model tu quyet, ton hon nhieu)
gemini.api.thinking-budget=0


# ==============================================================
# OPENSTREETMAP - AI TRAVEL PLANNER
# ==============================================================

# Photon - Geocoding
osm.photon.url=https://photon.komoot.io/api/

# Google Maps Routes API (tùy chọn): có key thì tối ưu lộ trình dùng thời gian đi đường thật,
# không có thì ước lượng theo đường chim bay. Cần bật "Routes API" và billing trên Google Cloud.
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# Overpass API
osm.overpass.url=https://overpass.private.coffee/api/interpreter
osm.overpass.fallback-urls=https://overpass-api.de/api/interpreter

# Cache
osm.cache.ttl-seconds=21600
osm.photon.cache-ttl-seconds=86400
# POI OSM da luu trong DB con moi (gio) thi dung luon, khong goi Overpass
osm.db.fresh-hours=168
# Overpass cho goi y: cho moi may chu 8s, sau 2.5s chua tra loi thi hoi song song may chu ke tiep, tong toi da 10s
osm.overpass.read-timeout-ms=8000
osm.overpass.hedge-delay-ms=2500
osm.overpass.total-timeout-ms=10000
osm.overpass.cooldown-seconds=90

# Gioi han luot goi AI cho moi nguoi dung (bao ve han muc Gemini mien phi)
ai.rate-limit.per-window=8
ai.rate-limit.window-minutes=5
ai.rate-limit.per-day=60

# User Agent
osm.user-agent=${OSM_USER_AGENT}

# Khi deploy, dat bien moi truong APP_FRONTEND_URL
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# So ngay moi co hieu luc
app.invitation.expiry-days=7

# Timeout SMTP: mang loi thi luong gui mail ko bi treo
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000